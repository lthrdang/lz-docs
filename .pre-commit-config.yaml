# Hooks use tools already installed on this machine (language: system),
# so no remote hook revisions need to be pinned here.
# Install once per repo:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt (check)
        entry: terraform fmt -check -diff -recursive
        language: system
        files: '\.(tf|tfvars)$'
        pass_filenames: false
      - id: tflint
        name: tflint
        entry: tflint --recursive
        language: system
        files: '\.tf$'
        pass_filenames: false
